[project]
name = "bobbuilder-backend"
version = "0.1.0"
description = "Ask construction drawings questions and get verifiable answers"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.8,<3",
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54",
  "sqlalchemy>=2.1,<2.2",
  "psycopg[binary]>=3.3,<4",
  "pgvector>=0.5,<0.6",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "python-multipart>=0.0.33",
  "redis>=8.1,<9",
  "rq>=3.0,<4",
  "ifcopenshell>=0.9,<0.10",
  "pymupdf>=2.1,<3",
  "numpy>=2.5,<3",
  "opencv-python-headless>=5.0,<6",
  "pillow>=13,<14",
  "pytesseract>=0.3.13,<0.4",
  "ezdxf>=1.4,<2",
  "shapely>=2.0,<3",
  "openai>=3.51,<4",
  "scikit-image>=0.26,<1",
]

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17", "mypy>=2.4", "httpx>=0.28"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["app", "eval"]
