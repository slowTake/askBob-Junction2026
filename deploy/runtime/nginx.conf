# nginx for the single-container image (D-034). Runs as the unprivileged `app` user, so it
# listens on 8080 and keeps its pid and temp files in /tmp. The API is in the same
# container, so /api goes to 127.0.0.1 and there is nothing to resolve.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8080;
    root /srv/ui;
    client_max_body_size 200m;

    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      # Server-sent events (/api/events, /api/ask) must not be buffered.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
