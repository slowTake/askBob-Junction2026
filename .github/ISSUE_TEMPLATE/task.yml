name: Task
description: A chunk of work, a few hours at most.
title: "<area>: <short description>"
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What to build or change, in two or three sentences.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What this unblocks or how it helps the demo.
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checks anyone can verify. Example, "`GET /answers` returns cited chunks for a test question".
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
