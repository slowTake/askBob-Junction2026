name: Bug
description: Something that worked, or should work, doesn't.
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
      description: What should happen, and what happens instead. Paste the raw error text.
    validations:
      required: true
