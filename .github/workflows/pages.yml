name: Demo

# Publishes the static demo (D-059) to GitHub Pages: the frontend built with
# `--mode demo` over the snapshot in frontend/demo, recorded by scripts/demo_snapshot.py.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: A snapshot has been recorded
        id: snapshot
        run: |
          if [ -f demo/snapshot.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No frontend/demo/snapshot.json yet; run make demo-snapshot"; fi
      - uses: actions/setup-node@v7
        if: steps.snapshot.outputs.found == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.snapshot.outputs.found == 'true'
        run: npm ci --no-audit --no-fund && npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        if: steps.snapshot.outputs.found == 'true'
        with:
          path: frontend/dist-demo
    outputs:
      found: ${{ steps.snapshot.outputs.found }}

  deploy:
    needs: build
    if: needs.build.outputs.found == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
