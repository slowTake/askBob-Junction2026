name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
      - name: OCR engine and a Unicode font for the raster pipeline tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app eval
      - run: uv run pytest -q

  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: File size (RULES.md §5)
        run: scripts/check-file-size.sh
      - name: Helper script tests
        run: scripts/bulk-issues-test.sh && scripts/aiven-env-test.sh && bash scripts/claude-env-test.sh && scripts/smoke-test.sh && python3 scripts/demo_snapshot_test.py
      - name: Conventional commits (RULES.md §1)
        if: github.event_name == 'pull_request'
        run: |
          pattern='^(feat|fix|test|refactor|docs|style|chore|ci|perf)(\([a-z0-9-]+\))?!?: .+'
          # Check the PR's own commits, not the merge commit GitHub creates for the run.
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          bad=$(git log --no-merges --format=%s "$range" | grep -Ev "$pattern" || true)
          if [ -n "$bad" ]; then echo "Not conventional:"; echo "$bad"; exit 1; fi

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Frontend image starts alone and follows the backend (D-033)
        run: scripts/frontend-image-test.sh
      - name: Single-container Runtime image passes smoke (D-034)
        run: scripts/runtime-image-test.sh
